autoDedupe: true

autoInstallPeers: false

color: always

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@standard-config/*'
  - '@vitest/*'
  - '@wasm-fmt/*'
  - vitest

overrides:
  vite-plus>@vitest/browser: '-'
  vite-plus>@vitest/browser-preview: '-'
  vite-plus>@vitest/mocker: '-'
  vite-plus>@vitest/pretty-format: '-'
  vite-plus>@vitest/snapshot: '-'
  vite-plus>@vitest/spy: '-'
  vite-plus>@vitest/utils: '-'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite-plus>vitest: '-'
  vite: npm:@voidzero-dev/vite-plus-core@latest

peerDependencyRules:
  allowAny:
    - '@vitest/browser-playwright'
    - '@vitest/coverage-v8'
    - typescript
    - vitest
  ignoreMissing:
    - eslint

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - tsrs
