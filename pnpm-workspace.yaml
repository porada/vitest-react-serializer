autoDedupe: true

autoInstallPeers: false

color: always

engineStrict: true

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@prettier/*'
  - '@standard-config/*'
  - '@vitest/*'
  - prettier
  - vitest

overrides:
  vite-plus>@vitest/browser: '-'
  vite-plus>@vitest/browser-preview: '-'
  vite-plus>@vitest/mocker: '-'
  vite-plus>@vitest/pretty-format: '-'
  vite-plus>@vitest/snapshot: '-'
  vite-plus>@vitest/spy: '-'
  vite-plus>@vitest/utils: '-'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite-plus>vitest: '-'
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - typescript
    - vitest
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 43200
