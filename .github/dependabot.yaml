version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - react
          - react-dom
      vitest:
        patterns:
          - '@vitest/browser-playwright'
          - '@vitest/coverage-v8'
          - vitest
    cooldown:
      default-days: 1
      exclude:
        - '@standard-config/*'
        - '@vitest/*'
        - '@wasm-fmt/*'
        - vitest
